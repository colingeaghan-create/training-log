<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hi: #22262f;
    --accent: #5eead4;
    --accent-dim: #2dd4bf33;
    --text: #f4f4f5;
    --text-dim: #9ca3af;
    --border: #2a2e37;
    --danger: #f87171;
    --success: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 80px;
  }
  header {
    padding: calc(20px + env(safe-area-inset-top)) 16px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; margin: 0 0 2px; }
  header p { margin: 0 0 8px; color: var(--text-dim); font-size: 13px; }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    overflow-x: auto;
    background: var(--bg);
    position: sticky;
    top: calc(62px + env(safe-area-inset-top));
    z-index: 9;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  main { padding: 16px; }
  .day-title { font-size: 17px; font-weight: 700; margin: 4px 0 14px; }
  .exercise-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .exercise-card.done { border-color: var(--success); }
  .ex-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .ex-name { font-weight: 700; font-size: 15px; }
  .ex-target { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
  .check-btn {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: transparent;
    font-size: 15px;
    line-height: 1;
  }
  .check-btn.checked { background: var(--success); border-color: var(--success); color: #0f1115; }
  .set-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .set-row label { width: 46px; color: var(--text-dim); font-size: 12.5px; }
  .set-row input {
    flex: 1;
    background: var(--card-hi);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 14px;
    min-width: 0;
  }
  .set-row span.x { color: var(--text-dim); font-size: 13px; }
  .cardio-row {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .cardio-field label {
    display: block;
    width: auto;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .cardio-field input,
  .cardio-field textarea {
    width: 100%;
    background: var(--card-hi);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  .cardio-field textarea {
    min-height: 90px;
    resize: vertical;
    line-height: 1.4;
  }
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-weight: 700;
    font-size: 15px;
  }
  .btn-primary { background: var(--accent); color: #0f1115; }
  .btn-secondary { background: var(--card-hi); color: var(--text); border: 1px solid var(--border); }
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .history-item .h-date { font-weight: 700; font-size: 14px; }
  .history-item .h-day { color: var(--accent); font-size: 12.5px; margin-bottom: 6px; }
  .history-item .h-ex { font-size: 13px; color: var(--text-dim); padding: 2px 0; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 14px; }
  .toast {
    position: fixed;
    bottom: 90px;
    left: 5%;
    right: 5%;
    background: var(--success);
    color: #0f1115;
    padding: 10px 18px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 99;
    text-align: center;
    word-break: break-word;
  }
  .toast.show { opacity: 1; }
  .timer-flash {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    background: var(--accent);
    animation: timerFlashPulse 0.3s ease-in-out 5;
  }
  @keyframes timerFlashPulse {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.85; }
  }
  .weight-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .starting-wt {
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .section-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .section-block ul {
    margin: 0;
    padding-left: 18px;
  }
  .section-block li {
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .section-block li:last-child { margin-bottom: 0; }
  .finisher-text {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.4;
  }
  .week-note {
    display: block;
    background: #1e3a5f4d;
    border: 1px solid #60a5fa;
    color: #93c5fd;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 9px;
    border-radius: 10px;
    margin-top: 6px;
    line-height: 1.4;
  }
  .history-item .h-edit-btn {
    margin-top: 10px;
    background: var(--card-hi);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .edit-ex-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .edit-ex-block .edit-ex-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .history-subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .history-subtab {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 20px;
    background: var(--card);
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .history-subtab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .trend-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .trend-card .trend-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .trend-card .trend-meta { font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
  .trend-card svg { display: block; width: 100%; height: auto; }
  .trend-point-label {
    font-size: 9px;
    fill: var(--text-dim);
  }
</style>
</head>

  <button class="btn btn-primary" id="saveBtn" disabled>Loading…</button>
</div>

<div class="toast" id="toast">Saved ✓</div>

const STORAGE_KEY = "colin-training-log-state";
let state = { history: [], lastDay: "Day 1", deload: false, drafts: {} };
let activeDay = state.lastDay;

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { history: [], lastDay: "Day 1", deload: false, drafts: {}, ...parsed };
    }
  } catch (e) {
    console.error("loadState error:", e);
  }
  return { history: [], lastDay: "Day 1", deload: false, drafts: {} };
}
async function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return { ok: true };
  } catch (e) {
    console.error("saveState error:", e);
    return { ok: false, error: (e && e.message) ? e.message : String(e) };
  }
}

// ---------- Draft state (in-progress, unsaved inputs) ----------
// Render rebuilds the DOM from scratch on every call (tab
// switches, etc.), which would normally wipe anything you've typed but not
// yet saved. These helpers persist every keystroke to state.drafts so a
// rebuild can restore exactly what was there.
function getDraftSet(dayName, exName, setIdx) {
  return state.drafts?.[dayName]?.[exName]?.[setIdx] || null;
}
function updateDraft(dayName, exName, setIdx, field, value) {
  if (!state.drafts) state.drafts = {};
  if (!state.drafts[dayName]) state.drafts[dayName] = {};
  if (!state.drafts[dayName][exName]) state.drafts[dayName][exName] = [];
  if (!state.drafts[dayName][exName][setIdx]) state.drafts[dayName][exName][setIdx] = {};
  state.drafts[dayName][exName][setIdx][field] = value;
}
function clearDraftsForDay(dayName) {
  if (state.drafts) delete state.drafts[dayName];
}

// Builds the blue "last week" note: what you actually logged last time, plus
// what to do this week based on those numbers.
function buildWeeklyNote(ex, last, suggestion) {
  if (!last || !last.sets.length) {
    return `<div class="week-note">Start workout with these weights and we'll determine notes next week.</div>`;
  }
  if (ex.cardio) {
    const v1 = last.sets[0] ? last.sets[0].weight : "";
    const v2 = last.sets[0] ? last.sets[0].reps : "";
    const parts = [];
    if (v1) parts.push(`${v1}${(ex.field1Label || "").toLowerCase().includes("duration") ? " min" : ""}`);
    if (v2) parts.push(v2);
    return `<div class="week-note">Last time: ${parts.join(" · ") || "logged"} — ${ex.prog}</div>`;
  }
  const setSummary = last.sets.map(s => `${s.weight || "?"}×${s.reps || "?"}`).join(", ");
  let directive;
  if (suggestion) {
    directive = suggestion.up
      ? `try ${suggestion.weight} lbs this week — you hit the top of the rep range`
      : `hold at ${suggestion.weight} lbs, aim to add a rep or two before going up`;
  } else {
    directive = "keep this as your baseline going forward";
  }
  return `<div class="week-note">Last week: ${setSummary} → ${directive}</div>`;
}

function getLastLog(exName) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    const found = h.exercises.find(e => e.name === exName);
    if (found) return found;
  }
  return null;
}

// Parses a target string like "3 × 5-8" or "2-3 × 12-20" into the top of the rep range.
function parseTopReps(targetStr) {
  const matches = targetStr.match(/(\d+)(?:[\u2013\u2014-](\d+))?\s*$/);
  if (!matches) return null;
  const high = matches[2] ? parseInt(matches[2], 10) : parseInt(matches[1], 10);
  return isNaN(high) ? null : high;
}

// Pulls a weight increment out of a prog note like "+5-10 lbs" or "+5 lbs". Falls back to 5.
function parseIncrement(progStr) {
  const m = progStr && progStr.match(/\+(\d+)/);
  return m ? parseInt(m[1], 10) : 5;
}

// Given an exercise definition and its most recent logged entry, suggests the weight
// to use next time: bump it if every set met or beat the top of the rep range, else hold.
function getSuggestion(ex, last) {
  if (!last || !last.sets.length) return null;
  const topReps = parseTopReps(ex.target);
  const weights = last.sets.map(s => parseFloat(s.weight)).filter(n => !isNaN(n));
  if (!weights.length) return null;
  const lastWeight = weights[weights.length - 1];

  if (topReps === null) return { weight: lastWeight, up: false };

  const allHitTop = last.sets.every(s => {
    const r = parseInt(s.reps, 10);
    return !isNaN(r) && r >= topReps;
  });

  if (allHitTop) {
    const inc = parseIncrement(ex.prog);
    return { weight: lastWeight + inc, up: true };
  }
  return { weight: lastWeight, up: false };
}

// Builds an ordered list of {date, weight} points for an exercise across all history,
// using the top (max) weight logged across that session's sets.
function getExerciseTrend(exName) {
  const points = [];
  state.history.forEach(h => {
    const found = h.exercises.find(e => e.name === exName);
    if (!found) return;
    const weights = found.sets.map(s => parseFloat(s.weight)).filter(n => !isNaN(n));
    if (!weights.length) return;
    const topReps = found.sets.reduce((max, s) => {
      const r = parseInt(s.reps, 10);
      return isNaN(r) ? max : Math.max(max, r);
    }, 0);
    points.push({ date: h.date, weight: Math.max(...weights), reps: topReps });
  });
  return points;
}

// Renders a small inline SVG line chart for a series of {date, weight} points.
function buildSparkline(points) {
  const w = 300, h = 90, padX = 10, padY = 14;
  const weights = points.map(p => p.weight);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);
  const range = maxW - minW || 1;

  const coords = points.map((p, i) => {
    const x = points.length === 1 ? w / 2 : padX + (i / (points.length - 1)) * (w - padX * 2);
    const y = h - padY - ((p.weight - minW) / range) * (h - padY * 2);
    return { x, y, p };
  });

  const linePath = coords.map((c, i) => (i === 0 ? "M" : "L") + c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");

  const dots = coords.map(c =>
    `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--accent)" />`
  ).join("");

  const firstLabel = `<text x="${coords[0].x}" y="${h - 2}" class="trend-point-label" text-anchor="start">${points[0].date.slice(5)}</text>`;
  const lastLabel = coords.length > 1
    ? `<text x="${coords[coords.length - 1].x}" y="${h - 2}" class="trend-point-label" text-anchor="end">${points[points.length - 1].date.slice(5)}</text>`
    : "";

  return `
    <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" />
      ${dots}
      ${firstLabel}
      ${lastLabel}
    </svg>
  `;
}

// ---------- Rest Timer ----------
let timerInterval = null;
let timerRemaining = 0;

function formatTimerTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = (totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateTimerDisplay() {
  const el = document.getElementById("timerDisplay");
  if (el) el.textContent = formatTimerTime(timerRemaining);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  const btn = document.getElementById("timerCancelBtn");
  if (btn) btn.style.display = "none";
}

function playAlarmSound() {
  const audio = document.getElementById("beepAudio");
  if (!audio) return;
  audio.currentTime = 0;
  audio.play().catch(e => console.error("Alarm playback failed:", e));
}

function flashScreen() {
  const flasher = document.createElement("div");
  flasher.className = "timer-flash";
  document.body.appendChild(flasher);
  setTimeout(() => flasher.remove(), 1800);
}

function timerDone() {
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300, 120, 300, 120, 300]);
  // The audio file itself contains all 5 alarm beeps back-to-back (baked in
  // at generation time), so one play() call is all that's needed - no risk
  // of stutters or dropped repeats from rapid restart calls.
  playAlarmSound();
  flashScreen();
  showToast("Time's up ⏰", false);
}

function startTimer(seconds) {
  stopTimer();
  // "Unlock" the audio element right here, inside the click handler - this is
  // a genuine user gesture, which iOS Safari requires before it will ever let
  // audio play. Trying to play it later inside the setInterval callback (when
  // the timer actually finishes, with no gesture) would get silently blocked.
  // Muted during this step since pause() isn't instant - without muting,
  // a brief moment of the real alarm sound would play audibly right now,
  // at the start of the rest period, instead of only at the end.
  const audio = document.getElementById("beepAudio");
  if (audio) {
    audio.muted = true;
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
      audio.muted = false;
    }).catch(e => {
      audio.muted = false;
      console.error("Audio unlock failed:", e);
    });
  }

  timerRemaining = seconds;
  updateTimerDisplay();
  const btn = document.getElementById("timerCancelBtn");
  if (btn) btn.style.display = "block";
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      stopTimer();
      timerDone();
    }
  }, 1000);
}

function renderTimerView() {
  document.getElementById("subhead").textContent = "Rest Timer";
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="day-title">Rest Timer</div>
    <div class="section-block" style="text-align:center; padding:28px 14px;">
      <div id="timerDisplay" style="font-size:56px; font-weight:800; margin-bottom:20px; font-variant-numeric: tabular-nums;">00:00</div>

  `;

function render() {
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.day === activeDay);
  });

  document.getElementById("saveBtn").style.display = activeDay === "Timer" ? "none" : "block";

  if (activeDay === "Timer") {
    renderTimerView();
    return;
  }

  const dayData = PROGRAM[activeDay];
  document.getElementById("subhead").textContent = dayData.label;

  const main = document.getElementById("main");
  main.innerHTML = "";

  const title = document.createElement("div");
  title.className = "day-title";
  title.textContent = dayData.label;
  main.appendChild(title);

  if (dayData.warmup && dayData.warmup.length) {
    const wu = document.createElement("div");
    wu.className = "section-block";
    wu.innerHTML = `
      <div class="section-title">Warm-Up</div>
      <ul>${dayData.warmup.map(w => `<li>${w}</li>`).join("")}</ul>
    `;
    main.appendChild(wu);
  }

  dayData.exercises.forEach((ex, idx) => {
    const last = getLastLog(ex.name);
    const suggestion = getSuggestion(ex, last);
    const card = document.createElement("div");
    card.className = "exercise-card";
    card.dataset.exName = ex.name;

    // Set count always comes from this exercise's own prescribed target (e.g.
    // "4 × 5-8" -> 4 sets, "2 × 12-15" -> 2 sets) - never from how many sets
    // happened to get saved last time, so a partial or skipped save can never
    // shrink the card. Cardio days log a single session, not sets.
    let numSets = 3;
    if (ex.cardio) {
      numSets = 1;
    } else {
      const setMatch = ex.target.match(/^(\d+)/);
      if (setMatch) numSets = parseInt(setMatch[1], 10);
    }

    // Starting weight for every set this session: the suggested weight (if we
    // have enough history to suggest one), else the last weight you logged for
    // this exercise, else the program's default starting weight. This value is
    // pre-filled as the actual input value (not just a placeholder) so saving
    // without touching the field still records the right weight.
    let startingWeight = "";
    if (suggestion) {
      startingWeight = suggestion.weight;
    } else if (last && last.sets.length) {
      const lastWeights = last.sets.map(s => parseFloat(s.weight)).filter(n => !isNaN(n));
      if (lastWeights.length) startingWeight = lastWeights[lastWeights.length - 1];
    }
    if (startingWeight === "") {
      // Grab just the FIRST number in the starting text (e.g. "10-15 lb DBs"
      // -> "10"). Stripping all non-digits used to concatenate range numbers
      // together (e.g. "10-15" became "1015").
      const m = ex.start.match(/\d+(\.\d+)?/);
      startingWeight = m ? m[0] : "";
    }

    let setsHtml = "";
    if (ex.cardio) {
      const draftSet = getDraftSet(activeDay, ex.name, 0) || {};
      const val1 = draftSet.weight !== undefined ? draftSet.weight : "";
      const val2 = draftSet.reps !== undefined ? draftSet.reps : "";
      setsHtml = `
        <div class="set-row cardio-row">
          <div class="cardio-field">
            <label>${ex.field1Label || "Value"}</label>
            <input type="number" inputmode="decimal" class="wt-input" value="${val1}" data-set="0">
          </div>
          <div class="cardio-field">
            <label>${ex.field2Label || "Notes"}</label>
            <textarea class="reps-input" data-set="0" rows="3">${val2}</textarea>
          </div>
        </div>`;
    } else {
      for (let s = 0; s < numSets; s++) {
        const draftSet = getDraftSet(activeDay, ex.name, s);
        const lastSet = last && last.sets[s] ? last.sets[s] : null;
        const wtValue = (draftSet && draftSet.weight !== undefined && draftSet.weight !== "") ? draftSet.weight : startingWeight;
        const repsValue = (draftSet && draftSet.reps !== undefined) ? draftSet.reps : "";
        const placeholderReps = lastSet ? lastSet.reps : "";
        setsHtml += `
          <div class="set-row">
            <label>Set ${s + 1}</label>
            <input type="number" inputmode="decimal" class="wt-input" value="${wtValue}" data-set="${s}">
            <span class="x">×</span>
            <input type="number" inputmode="numeric" class="reps-input" value="${repsValue}" placeholder="${placeholderReps || 'reps'}" data-set="${s}">
          </div>`;
      }
    }

    const weekNoteHtml = buildWeeklyNote(ex, last, suggestion) || "";

    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.target} · starting ${ex.start}</div>
          ${weekNoteHtml}
        </div>
        <button class="check-btn" data-idx="${idx}">✓</button>
      </div>
      <div class="sets-container">${setsHtml}</div>
    `;
    main.appendChild(card);

    card.querySelector(".check-btn").onclick = (e) => {
      card.classList.toggle("done");
      e.target.classList.toggle("checked");
    };

    // Persist every keystroke to the draft so a re-render (etc.,
    // switching tabs and back, etc.) never loses what you've typed.
    card.querySelectorAll(".wt-input").forEach(inp => {
      inp.oninput = async () => {
        const s = parseInt(inp.dataset.set, 10);
        updateDraft(activeDay, ex.name, s, "weight", inp.value);
        await saveState();
      };
    });
    card.querySelectorAll(".reps-input").forEach(inp => {
      inp.oninput = async () => {
        const s = parseInt(inp.dataset.set, 10);
        updateDraft(activeDay, ex.name, s, "reps", inp.value);
        await saveState();
      };
    });
  });

  if (dayData.finisher) {
    const fin = document.createElement("div");
    fin.className = "section-block";
    fin.innerHTML = `
      <div class="section-title">Finisher</div>
      <div class="finisher-text">${dayData.finisher}</div>
    `;
    main.appendChild(fin);
  }

  if (dayData.cooldown && dayData.cooldown.length) {
    const cd = document.createElement("div");
    cd.className = "section-block";
    cd.innerHTML = `
      <div class="section-title">Cool-Down</div>
      <ul>${dayData.cooldown.map(c => `<li>${c}</li>`).join("")}</ul>
    `;
    main.appendChild(cd);
  }
}

function showToast(msg, isError) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.background = isError ? "var(--danger)" : "var(--success)";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), isError ? 8000 : 1500);
}

// ---------- Save workout ----------
async function handleSave() {
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";
  try {
    const dayData = PROGRAM[activeDay];
    const cards = document.querySelectorAll(".exercise-card");
    const exercises = [];

    cards.forEach(card => {
      const name = card.dataset.exName;
      const sets = [];
      card.querySelectorAll(".set-row").forEach(row => {
        const wtInput = row.querySelector(".wt-input");
        const repsInput = row.querySelector(".reps-input");
        const wt = wtInput ? wtInput.value : "";
        const reps = repsInput ? repsInput.value : "";
        if (wt || reps) sets.push({ weight: wt, reps: reps });
      });
      if (sets.length) exercises.push({ name, sets });
    });

    if (!exercises.length) {
      alert("Log at least one set before saving.");
      return;
    }

    const entry = {
      date: new Date().toISOString().slice(0, 10),
      day: activeDay,
      label: dayData.label,
      exercises
    };

    state.history.push(entry);
    clearDraftsForDay(activeDay);

    const result = await saveState();
    if (!result.ok) {
      showToast("Save failed: " + (result.error || "unknown error"), true);
    } else {
      showToast("Saved ✓", false);
    }

    // reset inputs
    document.querySelectorAll(".wt-input, .reps-input").forEach(i => i.value = "");
    document.querySelectorAll(".exercise-card").forEach(c => {
      c.classList.remove("done");
      c.querySelector(".check-btn").classList.remove("checked");
    });
  } catch (e) {
    console.error("handleSave error:", e);
    showToast("Something went wrong: " + (e && e.message ? e.message : String(e)), true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Save Workout";
  }
}
document.getElementById("saveBtn").onclick = handleSave;

// ---------- Init ----------
async function init() {
  state = await loadState();
  activeDay = state.lastDay || "Day 1";

  buildTabs();

  document.getElementById("historyBtn").disabled = false;
  document.getElementById("saveBtn").disabled = false;
  document.getElementById("saveBtn").textContent = "Save Workout";

  render();
}
init();

// ---------- History view ----------
let showingHistory = false;
let historySubTab = "log"; // "log" | "trends"

function renderHistoryItemView(item, h, index) {
  const exLines = h.exercises.map(e => {
    const setStr = e.sets.map(s => `${s.weight || "?"}×${s.reps || "?"}`).join(", ");
    return `<div class="h-ex">${e.name}: ${setStr}</div>`;
  }).join("");
  item.innerHTML = `
    <div class="h-date">${h.date}</div>
    <div class="h-day">${h.label}</div>
    ${exLines}
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="h-edit-btn" style="flex:1;">Edit</button>
      <button class="h-delete-btn" style="flex:1; background:#f8717133; color:var(--danger); border:1px solid var(--danger); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600;">Delete</button>
    </div>
  `;
  item.querySelector(".h-edit-btn").onclick = () => renderHistoryItemEdit(item, h, index);
  item.querySelector(".h-delete-btn").onclick = async () => {
    const confirmed = window.confirm(`Delete the ${h.date} (${h.label}) entry? This can't be undone.`);
    if (!confirmed) return;
    state.history.splice(index, 1);
    const r = await saveState();
    if (!r.ok) {
      showToast("Delete failed: " + (r.error || "unknown error"), true);
      return;
    }
    showToast("Entry deleted ✓", false);
    renderHistory();
  };
}

function renderHistoryItemEdit(item, h, index) {
  const exEditHtml = h.exercises.map((e, exIdx) => {
    const setsHtml = e.sets.map((s, sIdx) => `
      <div class="set-row">
        <label>Set ${sIdx + 1}</label>
        <input type="number" inputmode="decimal" class="edit-wt" data-ex="${exIdx}" data-set="${sIdx}" value="${s.weight || ''}">
        <span class="x">×</span>
        <input type="number" inputmode="numeric" class="edit-reps" data-ex="${exIdx}" data-set="${sIdx}" value="${s.reps || ''}">
      </div>
    `).join("");
    return `<div class="edit-ex-block"><div class="edit-ex-name">${e.name}</div>${setsHtml}</div>`;
  }).join("");

  item.innerHTML = `
    <div class="h-date">${h.date}</div>
    <div class="h-day">${h.label}</div>
    ${exEditHtml}
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn btn-secondary h-cancel-btn" style="padding:10px; font-size:13px;">Cancel</button>
      <button class="btn btn-primary h-save-btn" style="padding:10px; font-size:13px;">Save changes</button>
    </div>
  `;

  item.querySelector(".h-cancel-btn").onclick = () => renderHistoryItemView(item, h, index);
  item.querySelector(".h-save-btn").onclick = async () => {
    item.querySelectorAll(".edit-wt, .edit-reps").forEach(inp => {
      const exIdx = parseInt(inp.dataset.ex, 10);
      const sIdx = parseInt(inp.dataset.set, 10);
      const field = inp.classList.contains("edit-wt") ? "weight" : "reps";
      h.exercises[exIdx].sets[sIdx][field] = inp.value;
    });
    const r = await saveState();
    if (!r.ok) {
      showToast("Save failed: " + (r.error || "unknown error"), true);
      return;
    }
    showToast("History updated ✓", false);
    renderHistoryItemView(item, h, index);
  };
}

function renderHistoryLog(main) {
  if (!state.history.length) {
    main.innerHTML = `<div class="empty">No workouts logged yet.<br>Log your first session and it'll show up here.</div>`;
    return;
  }
  [...state.history]
    .map((h, realIndex) => ({ h, realIndex }))
    .reverse()
    .forEach(({ h, realIndex }) => {
      const item = document.createElement("div");
      item.className = "history-item";
      renderHistoryItemView(item, h, realIndex);
      main.appendChild(item);
    });
}

function renderHistoryTrends(main) {
  // Collect exercise names in the order they first appeared, across all history.
  const seen = [];
  state.history.forEach(h => {
    h.exercises.forEach(e => { if (!seen.includes(e.name)) seen.push(e.name); });
  });

  const chartable = seen
    .map(name => ({ name, points: getExerciseTrend(name) }))
    .filter(t => t.points.length >= 2); // need at least 2 points for a trend line

  if (!chartable.length) {
    main.innerHTML = `<div class="empty">Log a couple more sessions for the same exercise<br>to start seeing trend lines here.</div>`;
    return;
  }

  chartable.forEach(t => {
    const card = document.createElement("div");
    card.className = "trend-card";
    const first = t.points[0].weight;
    const latest = t.points[t.points.length - 1].weight;
    const diff = latest - first;
    const diffText = diff > 0 ? `+${diff} lbs since first log` : diff < 0 ? `${diff} lbs since first log` : "steady";
    card.innerHTML = `
      <div class="trend-name">${t.name}</div>
      <div class="trend-meta">${t.points.length} sessions logged · ${diffText}</div>
      ${buildSparkline(t.points)}
    `;
    main.appendChild(card);
  });
}

// ---------- Backup / Restore ----------
// Local storage lives only on this device/browser - nothing is synced
// anywhere. These let you save a real file (to Files, iCloud Drive, email to
// yourself, etc.) as an independent safety net, and load it back if this
// device's storage is ever cleared or wiped.
function exportBackup() {
  const payload = JSON.stringify(state, null, 2);
  const blob = new Blob([payload], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `training-log-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Backup file downloaded ✓", false);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch (e) {
      showToast("That file isn't valid JSON", true);
      return;
    }
    if (!parsed || !Array.isArray(parsed.history)) {
      showToast("That file doesn't look like a training log backup", true);
      return;
    }
    const confirmed = window.confirm(
      `This will replace your current data with the backup (${parsed.history.length} workouts). Continue?`
    );
    if (!confirmed) return;
    state = { history: [], lastDay: "Day 1", deload: false, drafts: {}, ...parsed };
    const r = await saveState();
    if (!r.ok) {
      showToast("Restore failed: " + (r.error || "unknown error"), true);
      return;
    }
    showToast("Backup restored ✓", false);
    renderHistory();
  };
  reader.readAsText(file);
}

function renderHistory() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const title = document.createElement("div");
  title.className = "day-title";
  title.textContent = "Workout History";
  main.appendChild(title);

  const backupRow = document.createElement("div");
  backupRow.style.cssText = "display:flex; gap:8px; margin-bottom:14px;";
  backupRow.innerHTML = `
    <button class="btn btn-secondary" id="backupBtn" style="flex:1; padding:10px; font-size:12.5px;">Backup</button>
    <button class="btn btn-secondary" id="restoreBtn" style="flex:1; padding:10px; font-size:12.5px;">Restore</button>
    <input type="file" id="restoreFileInput" accept="application/json" style="display:none;">
  `;
  main.appendChild(backupRow);
  document.getElementById("backupBtn").onclick = exportBackup;
  document.getElementById("restoreBtn").onclick = () => document.getElementById("restoreFileInput").click();
  document.getElementById("restoreFileInput").onchange = (e) => {
    if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  };

  const subtabs = document.createElement("div");
  subtabs.className = "history-subtabs";
  subtabs.innerHTML = `
    <button class="history-subtab ${historySubTab === "log" ? "active" : ""}" data-tab="log">Log</button>
    <button class="history-subtab ${historySubTab === "trends" ? "active" : ""}" data-tab="trends">Trends</button>
  `;
  main.appendChild(subtabs);
  subtabs.querySelectorAll(".history-subtab").forEach(btn => {
    btn.onclick = () => {
      historySubTab = btn.dataset.tab;
      renderHistory();
    };
  });

  if (historySubTab === "log") renderHistoryLog(main);
  else renderHistoryTrends(main);
}

document.getElementById("historyBtn").onclick = () => {
  showingHistory = !showingHistory;
  document.getElementById("historyBtn").textContent = showingHistory ? "Back to Log" : "History";
  document.getElementById("tabs").style.display = showingHistory ? "none" : "flex";
  document.getElementById("saveBtn").style.display = showingHistory ? "none" : "block";

  if (!showingHistory) { render(); return; }
  renderHistory();
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => {
      console.error("SW registration failed:", err);
    });
  });
}
